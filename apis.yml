- aid: aurinko:aurinko-auth-api
  name: Yoxel Auth API
  description: >-
    Aurinko's Unified OAuth Flows are backed by providers’ OAuth2 flows (i.e. Google, Office 365, Salesforce,
    HubSpot,...)

    or by secure password-based authentications (i.e. MS Exchange, IMAP accounts). The following three
    flows are supported:


    1. Account OAuth - User delegated authorization that produces an Aurinko account and an access token.

    2. Service Account OAuth - Admin/Org-level authorization that produces an Auirnko service account
    and an access token.

    3. User OAuth - User delegated authorization that produces an Aurinko User, its primary account, and
    a user session token or cookie.


    See [this user guide](https://docs.aurinko.io/authentication/authentication-flow) for more information.
  humanURL: https://apirefs.aurinko.io/
  baseURL: https://api.aurinko.io
