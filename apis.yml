name: Yoxel
image: https://www.aurinko.io/images/image-logo.png
description: Aurinko provides a unified API platform that integrates email, calendar, contacts, and tasks across major services. Their solution
  enables developers to streamline inbox integration, automate workflows, and enhance productivity for enterprises. With a free trial and trusted
  by leading companies, Aurinko aims to simplify communication management through a single, consistent API layer, reducing development overhead
  and improving user experience.
