  - term: User
    definition: '`User` is an Aurinko managed entity that your app can leverage to implement user session management. Multiple regular Aurinko
      accounts can be linked to a `User` however there is always one primary account that acts as the user id-provider. The `User` sessions allow
      browser apps to store all their account access tokens securely on the Aurinko servers.'
