components:
  schemas:
    CreateMeetingResponse:
      type: object
      properties:
        created:
          type: boolean
        id:
          type: string
          description: The created calendar event ID, if event was created
        ReservationId:
          type: integer
          format: int64
          description: The unconfirmed reservation ID
        groupXid:
          type: string
          description: Group external id for group booking
    BookingAvailableProfilesInDto:
      type: object
      properties:
        timeMin:
          type: string
          format: date-time
        timeMax:
          type: string
          format: date-time
        profileNames:
          type: array
          items:
            type: string
        profileIds:
          type: array
          items:
            type: integer
            format: int64
        required:
          $ref: '#/components/schemas/BookingRequiredMode'
    AdditionalField:
      type: object
      properties:
        name:
          type: string
          description: Substitution variable name
        type:
          type: string
          description: Value type
        default:
          type: string
          description: Default value
    CreateMeetingDto:
      type: object
      properties:
        time:
          $ref: '#/components/schemas/SelectedMeetingTime'
        groupXids:
          type: array
          items:
            type: string
            description: Group external id from available meeting times request
        accountIds:
          type: array
          items:
            type: integer
            format: int64
            description: Account id from available meeting times request
        name:
          type: string
          description: Username of the person requesting the meeting
        email:
          type: string
          description: Email of the person requesting the meeting, if not specified, an event will be created without an attendee
        substitutionData:
          type: object
          description: Data for substitution instead of templates, key - value
          additionalProperties:
            type: string
    BookingTimesOutDto:
      type: object
      properties:
        items:
          type: array
          description: List of available meeting slots.
          items:
            $ref: '#/components/schemas/BookingMeetingInterval'
        startTime:
          type: string
          format: date-time
          description: Start time of available meeting slots.
        endTime:
          type: string
          format: date-time
          description: End time of available meeting slots.
        timeAvailableFor:
          type: string
          description: Time period (in ISO-8601 format) the profile is covering. For example, P3M (3 months), P4W (4 weeks), P5D (5 days).
          example: P4W
        durationMinutes:
          type: integer
          description: Length of meeting in minutes
        availabilityStep:
          type: integer
          description: Determines the interval at which new meeting slots are made available throughout the working hours. Allowed values are 5, 10, 15, 20, 30, 60.
        subject:
          type: string
          description: Subject for events booked using this profile.
        primaryColor:
          type: string
          description: Primary Color, taken from the application settings.
        secondaryColor:
          type: string
          description: The second Color, taken from the application settings.
        additionalFields:
          type: array
          description: List of substitution variables like {{name}}, {{openMeetingUrl}},...
          items:
            $ref: '#/components/schemas/AdditionalField'
        nextPageToken:
          type: string
          description: Next page token
        nextFromDate:
          type: string
          format: date
          description: Next fromDate to iterate a big time intervals
    BookingRequiredMode:
      type: string
      enum:
      - one
      - all
    SelectedMeetingTime:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    BookingAvailableProfilesOutDto:
      type: object
      properties:
        profileIds:
          type: array
          description: List of available profile ids.
          items:
            type: integer
            format: int64
    BookingMeetingInterval:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        groupXids:
          type: array
          items:
            type: string
        accountIds:
          type: array
          items:
            type: integer
            format: int64
  responses:
    UnauthorizedError2:
      description: Authentication information is missing or invalid
      headers:
        WWW_Authenticate:
          schema:
            type: string
  securitySchemes:
    AppAuth:
      type: http
      scheme: basic
      description: App-level basic authentication using Client ID and Client Secret that can be obtained at Aurinko Dashboard page.
    AccountToken:
      type: http
      scheme: bearer
      description: Account-level authentication with account token obtained using `/auth/authorize` endpoint.
    UserSessionCookie:
      type: apiKey
      in: cookie
      name: AUR{APPID}
      description: Cookie-based user-level authentication
    UserSessionHeader:
      type: apiKey
      in: header
      name: X-Aurinko-Session
      description: Token-based user-level authentication
    ClientIdHeader:
      type: apiKey
      in: header
      name: X-Aurinko-Client-Id
      description: Client ID that can be obtained at Aurinko Dashboard page
    AccountIdHeader:
      type: apiKey
      in: header
      name: X-Aurinko-Account-Id
      description: User account id
    AuthTypeHeader:
      type: apiKey
      in: header
      name: X-Aurinko-Auth-Type
      description: 'Authentication type. Possible values: default, exchangeIdToken'
    ExchangeIdToken:
      type: http
      scheme: bearer
      bearerFormat: 'Exchange Identity Token (only with `X-Aurinko-Auth-Type: exchangeIdToken` header.)'
      description: 'Authentication using Exchange Identity Token. To use this method `X-Aurinko-Auth-Type: exchangeIdToken` header should be used.'
