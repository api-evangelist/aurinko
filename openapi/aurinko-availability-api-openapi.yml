tags:
- name: Availability
  x-displayName: Availability
  description: See meeting time availability according to the group booking profile configuration. Book a meeting for an account or one of users in a group.
paths:
  /v1/book/account/profiles/{id}/meeting:
    post:
      operationId: bookingAccountCreateMeeting
      tags:
      - Availability
      summary: Create a meeting
      parameters:
      - schema:
          format: int64
          type: integer
        in: path
        name: id
        description: A booking id
        required: true
      - schema:
          default: one
          type:
          - core.client.booking.bookingrequiredmode.bookingrequiredmode
          - 'null'
          $ref: '#/components/schemas/BookingRequiredMode'
        in: query
        name: required
        description: a way to select times
        required: false
      - schema:
          format: int64
          type:
          - integer
          - 'null'
        in: query
        name: reserveForMinutes
        description: Time in minutes, blocks the interval for a time (creates an unconfirmed reservation), the meeting is not created
        required: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMeetingResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError2'
    get:
      operationId: bookingAccountMeetingTimes
      tags:
      - Availability
      summary: Get available meeting times
      parameters:
      - schema:
          format: int64
          type: integer
        in: path
        name: id
        description: A booking id
        required: true
      - schema:
          default: one
          type:
          - core.client.booking.bookingrequiredmode.bookingrequiredmode
          - 'null'
          $ref: '#/components/schemas/BookingRequiredMode'
        in: query
        name: required
        description: a way to select times
        required: false
      - schema:
          format: date
          type:
          - string
          - 'null'
        in: query
        name: fromDate
        description: date to iterate a big time intervals
        required: false
      - schema:
          type:
          - string
          - 'null'
        in: query
        name: intervalLength
        description: Time period (in ISO-8601 format) to iterate a big time intervals
        required: false
      - schema:
          type:
          - string
          - 'null'
        in: query
        name: pageToken
        description: token to request all pages, if booking has many accounts
        required: false
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          format: int32
          type:
          - integer
          - 'null'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTimesOutDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError2'
  /v1/book/group/profiles/dynamic/availability:
    post:
